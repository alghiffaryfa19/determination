# 400 logical dpi: nearest clean scale to Android's 420 dpi panel density.
# 2.0 keeps a 540x1170 logical desktop: dense enough that phone UI is not oversized.
monitor = HWC-1, preferred, 0x0, 2.0
# External DP-alt monitors land to the right of the panel; 1.5 keeps
# desktop UI readable on a 1080p panel viewed at arm's length.
monitor = HWC-EXT-1, preferred, auto-right, 1.5

# Touch gestures (hyprgrass, built against the pinned Hyprland headers).
# The plugin must exist: a missing plugin makes Hyprland reload its config in a
# tight loop, which starves and kills the shell.
# Discrete 3-finger l/r stay unbound: the continuous workspace swipe below
# already owns horizontal 3-finger drags and both would fire.
plugin = /opt/hyprland/lib/libhyprgrass.so
plugin {
    touch_gestures {
        # Phone panel wants a hotter response than a tablet.
        sensitivity = 4.0
        workspace_swipe_fingers = 3
        workspace_swipe_edge = none
        long_press_delay = 400
        edge_margin = 10
        resize_on_border_long_press = true
        # 3 fingers: system. Tap opens the menu, up opens apps, down finds a clean workspace.
        hyprgrass-bind = , tap:3, exec, /usr/local/bin/aurora-omarchy menu
        hyprgrass-bind = , swipe:3:u, exec, /usr/local/bin/aurora-omarchy apps
        hyprgrass-bind = , swipe:3:d, workspace, empty
        # 4 fingers: windows. Tap toggles fullscreen, horizontal swipes throw the window across workspaces.
        hyprgrass-bind = , tap:4, fullscreen, 0
        hyprgrass-bind = , swipe:4:l, movetoworkspace, -1
        hyprgrass-bind = , swipe:4:r, movetoworkspace, +1
        hyprgrass-bind = , swipe:4:u, togglefloating,
        hyprgrass-bind = , swipe:4:d, exec, /usr/local/bin/aurora-osk toggle
        # Deliberate 3-finger hold closes the active window.
        hyprgrass-bind = , longpress:3, killactive,
        # Screen edges: bottom opens apps, top opens the menu, sides move through workspaces.
        hyprgrass-bind = , edge:d:u, exec, /usr/local/bin/aurora-omarchy apps
        hyprgrass-bind = , edge:u:d, exec, /usr/local/bin/aurora-omarchy menu
        hyprgrass-bind = , edge:l:r, workspace, -1
        hyprgrass-bind = , edge:r:l, workspace, +1
    }
}

debug {
    disable_logs = false
}
# Phone tuning: a 432x936 logical panel leaves little room, so gaps, borders
# and animation distances stay small for the vendor GL path.
general {
    # Phone screens are small: tight padding, visible borders, themed colours.
    gaps_in = 2
    gaps_out = 4
    border_size = 3
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(3b4261aa)
}
env = XCURSOR_SIZE,24
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    enable_swallow = true
}
cursor {
    no_hardware_cursors = true
    hide_on_touch = true
}
input {
    follow_mouse = 1
    mouse_refocus = false
    sensitivity = 0
    accel_profile = flat
    touchdevice {
        enabled = true
        output = HWC-1
        transform = 0
    }
}
decoration {
    rounding = 22
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}
layerrule = blur, ^omarchy-(bar|menu|notifications|osd)$
layerrule = ignorealpha 0.1, ^omarchy-(bar|menu|notifications|osd)$
layerrule = noanim, ^omarchy-(bar|menu|notifications|osd)$
layerrule = noanim, ^omarchy-.*-dismiss$
# Omarchy command windows (menu Install/Setup/Update actions) launch under
# this app-id via omarchy-launch-floating-terminal-with-presentation.
windowrulev2 = float, class:org.omarchy.terminal
windowrulev2 = center, class:org.omarchy.terminal
windowrulev2 = size 900 600, class:org.omarchy.terminal
animations {
    enabled = true
    bezier = auroraArrive, 0.16, 1, 0.3, 1
    bezier = auroraLeave, 0.4, 0, 1, 1
    animation = windowsIn, 1, 3.2, auroraArrive, popin 94%
    animation = windowsOut, 1, 1.8, auroraLeave, popin 98%
    animation = windowsMove, 1, 3, auroraArrive
    animation = workspaces, 1, 3.2, auroraArrive, slidefade 12%
    animation = layers, 1, 2, auroraArrive, fade
}
xwayland {
    force_zero_scaling = true
}
exec-once = env EGL_PLATFORM=wayland HYBRIS_EGLPLATFORM=wayland GDK_BACKEND=wayland squeekboard
bind = SUPER, Return, exec, foot /bin/bash
# Phone hardware keys, forwarded from the host input proxy. PipeWire owns
# the codec while desktop mode claims it, so volume keys drive the guest
# sink instead of Android streams.
bindel = , XF86AudioRaiseVolume, exec, aurora-audio-volume up
bindel = , XF86AudioLowerVolume, exec, aurora-audio-volume down
bindl = , XF86AudioMute, exec, aurora-audio-volume mute
bind = SUPER, K, exec, /usr/local/bin/aurora-osk toggle
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, E, exec, touch /mnt/aurora-control/exit
bind = SUPER, F, fullscreen, 0
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
