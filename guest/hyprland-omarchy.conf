# 400 logical dpi: nearest clean scale to Android's 420 dpi panel density.
monitor = HWC-1, preferred, 0x0, 2.5
monitor = , preferred, auto, 1

# Touch gestures (hyprgrass, built in-guest against the pinned Hyprland).
plugin = /opt/dethyprland/lib/hyprgrass.so
plugin {
    touch_gestures {
        # Phone panel wants a hotter response than a tablet.
        sensitivity = 4.0
        workspace_swipe_fingers = 3
        # Swipe up from the bottom edge: app menu.
        workspace_swipe_edge = d
        long_press_delay = 400
        edge_margin = 10
        resize_on_border_long_press = true
        # 3-finger tap: app menu. 4-finger tap: fullscreen.
        hyprgrass-bind = , tap:3, exec, /usr/local/bin/det-omarchy menu
        hyprgrass-bind = , tap:4, fullscreen, 0
        # Bottom edge swipe up: next workspace.
        hyprgrass-bind = , edge:d:u, workspace, +1
    }
}

debug {
    disable_logs = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
cursor {
    no_hardware_cursors = true
    hide_on_touch = true
}
input {
    follow_mouse = 1
    mouse_refocus = false
    tap-to-click = true
    touchdevice {
        enabled = true
        output = HWC-1
        transform = 0
    }
}
decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}
layerrule = blur, ^omarchy-(bar|menu|notifications|osd)$
layerrule = ignorealpha 0.1, ^omarchy-(bar|menu|notifications|osd)$
layerrule = noanim, ^omarchy-(bar|menu|notifications|osd)$
layerrule = noanim, ^omarchy-.*-dismiss$
animations {
    enabled = true
    bezier = detArrive, 0.16, 1, 0.3, 1
    bezier = detLeave, 0.4, 0, 1, 1
    animation = windowsIn, 1, 3.2, detArrive, popin 94%
    animation = windowsOut, 1, 1.8, detLeave, popin 98%
    animation = windowsMove, 1, 3, detArrive
    animation = workspaces, 1, 3.2, detArrive, slidefade 12%
    animation = layers, 1, 2, detArrive, fade
}
xwayland {
    force_zero_scaling = false
}
exec-once = env EGL_PLATFORM=wayland HYBRIS_EGLPLATFORM=wayland GDK_BACKEND=wayland squeekboard
bind = SUPER, Return, exec, foot /bin/bash
bind = SUPER, K, exec, /usr/local/bin/det-osk toggle
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, E, exec, touch /mnt/det-control/exit
bind = SUPER, F, fullscreen, 0
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
