[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
wayland-scanner = '/usr/bin/wayland-scanner'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'

[properties]
sys_root = '/work/build/arch-desktop/sysroot'
pkg_config_libdir = ['/work/build/arch-desktop/sysroot/usr/local/lib/pkgconfig', '/work/build/arch-desktop/sysroot/usr/lib/pkgconfig', '/work/build/arch-desktop/sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--sysroot=/work/build/arch-desktop/sysroot']
cpp_args = ['--sysroot=/work/build/arch-desktop/sysroot']
c_link_args = ['--sysroot=/work/build/arch-desktop/sysroot', '-L/work/build/arch-desktop/sysroot/usr/local/lib', '-L/work/build/arch-desktop/sysroot/usr/lib', '-Wl,-rpath-link,/work/build/arch-desktop/sysroot/usr/local/lib', '-Wl,-rpath-link,/work/build/arch-desktop/sysroot/usr/lib']
cpp_link_args = ['--sysroot=/work/build/arch-desktop/sysroot', '-L/work/build/arch-desktop/sysroot/usr/local/lib', '-L/work/build/arch-desktop/sysroot/usr/lib', '-Wl,-rpath-link,/work/build/arch-desktop/sysroot/usr/local/lib', '-Wl,-rpath-link,/work/build/arch-desktop/sysroot/usr/lib']
