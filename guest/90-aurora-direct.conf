# OnePlus 7 direct speaker sink. Android ownership and the vendor mixer route
# are established before PipeWire starts; this node only opens MultiMedia1.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 1024
}

context.objects = [
    { factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "aurora-speaker"
            node.description       = "OnePlus 7 Speakers"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,0"
            api.alsa.period-size   = 1024
            api.alsa.headroom      = 0
            api.alsa.disable-mmap  = true
            api.alsa.disable-batch = false
            api.alsa.use-chmap     = false
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = "FL,FR"
        }
    }
]
