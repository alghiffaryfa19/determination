# 400 logical dpi: nearest clean scale to Android's 420 dpi panel density.
monitor = HWC-1, preferred, 0x0, 2.5
# Apply a sane layout to any later output the vendor HWC backend exposes.
monitor = , preferred, auto, 1
debug {
    disable_logs = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
cursor {
    no_hardware_cursors = true
}
input {
    follow_mouse = 1
    mouse_refocus = false
    touchdevice {
        enabled = true
        output = HWC-1
        transform = 0
    }
}
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = true
    bezier = auroraArrive, 0.16, 1, 0.3, 1
    bezier = auroraLeave, 0.4, 0, 1, 1
    animation = windowsIn, 1, 3.2, auroraArrive, popin 94%
    animation = windowsOut, 1, 1.8, auroraLeave, popin 98%
    animation = windowsMove, 1, 3, auroraArrive
    animation = workspaces, 1, 3.2, auroraArrive, slide 12%
    animation = layers, 1, 2, auroraArrive, fade
    animation = fade, 1, 1.8, auroraArrive
    animation = border, 1, 2, auroraArrive
}
xwayland {
    force_zero_scaling = false
}
exec-once = env EGL_PLATFORM=wayland HYBRIS_EGLPLATFORM=wayland GDK_BACKEND=wayland squeekboard
exec-once = /bin/sh -c 'case "${DETHYPR_SHELL:-aurora-hypr-shell}" in opal) exec /usr/local/bin/aurora-opal start ;; *) exec /usr/local/bin/aurora-hypr-shell ;; esac'
exec-once = foot --title=Hyprland /bin/bash
bind = SUPER, Return, exec, foot /bin/bash
bind = SUPER, K, exec, /usr/local/bin/aurora-osk toggle
bind = SUPER, D, exec, /usr/local/bin/aurora-hypr-shell --toggle
bindl = , XF86PowerOff, exec, /usr/local/bin/aurora-hypr-shell --power
# On guacamoleb the physical rocker arrives with these XF86 symbols inverted.
bindel = , XF86AudioRaiseVolume, exec, /usr/local/bin/aurora-hypr-shell --volume-down
bindel = , XF86AudioLowerVolume, exec, /usr/local/bin/aurora-hypr-shell --volume-up
bindl = , XF86AudioMute, exec, /usr/local/bin/aurora-hypr-shell --mute
bindl = , XF86AudioPlay, exec, /usr/local/bin/aurora-hypr-shell --play-pause
bindl = , XF86AudioNext, exec, /usr/local/bin/aurora-hypr-shell --next
bindl = , XF86AudioPrev, exec, /usr/local/bin/aurora-hypr-shell --previous
bind = SUPER SHIFT, E, exec, touch /mnt/aurora-control/exit
bind = SUPER, F, fullscreen, 0
bind = SUPER, V, togglefloating, active
bind = SUPER, Q, killactive,
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
