# Aurora device profile. Values omitted here are discovered at runtime.
# Copy to /data/aurora/etc/device.conf only when discovery is wrong.
AURORA_PROFILE_ID=example
# AURORA_BACKLIGHT_PATH=/sys/class/backlight/panel0-backlight/brightness
# AURORA_BACKLIGHT_LEVEL=800
# AURORA_WIFI_IFACE=wlan0
# AURORA_DRM_CARD=/dev/dri/card0
# AURORA_DRM_RENDER_NODE=/dev/dri/renderD128
# AURORA_BATTERY_GAUGE=bms
# AURORA_INPUT_QUIRK=none
# AURORA_HWC_OUTPUT=HWCOMPOSER-1
# Vendor blobs through libhybris are the compatibility default. Minigbm is
# the compositor-facing GBM implementation, not the GPU renderer.
# AURORA_GRAPHICS_RENDERER=libhybris
# AURORA_GBM_PROVIDER=minigbm
# AURORA_PANEL_WIDTH=1080
# AURORA_PANEL_HEIGHT=2400
# Preferred internal HWC mode in millihertz; omitted means keep Android/HWC default.
# AURORA_PANEL_REFRESH_MHZ=90000
# AURORA_OUTPUT_SCALE=3
# Space-separated device nodes needed by an uncommon GPU/display stack.
# AURORA_EXTRA_DEVICES="/dev/vendor_gpu /dev/vendor_allocator"
# AURORA_LINUX_FIRST_SUPPORTED=0
# AURORA_LINUX_FIRST_KEEP_NETWORK=1
# AURORA_LINUX_FIRST_FREEZE_SYSTEM_SERVER=1
