# OnePlus 7 / 7 Pro family baseline, recon-verified on guacamoleb.
AURORA_PROFILE_ID=guacamoleb
AURORA_BACKLIGHT_PATH=/sys/class/backlight/backlight/brightness
AURORA_BACKLIGHT_LEVEL=1400
AURORA_WIFI_IFACE=wlan0
AURORA_DRM_CARD=/dev/dri/card0
AURORA_BATTERY_GAUGE=bms
AURORA_INPUT_QUIRK=oneplus-touchpanel-zero-axes
# Product default is Mesa auto-discovery; this device's proven optional fast
# path is zink over Turnip/KGSL.
AURORA_EXTERNAL_RENDERER=turnip-zink
AURORA_LINUX_FIRST_SUPPORTED=1
AURORA_LINUX_FIRST_KEEP_NETWORK=1
AURORA_LINUX_FIRST_FREEZE_SYSTEM_SERVER=1
